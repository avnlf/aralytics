
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Aralytics</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h2><a href="index.html">Aralytics</a></h2>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main class="login-container">

        <div class="login-card">

            <h1 id="authTitle">Welcome to Aralytics!</h1>

            <p class="login-description" id="authDescription">
                Your academic journey starts here.
            </p>

            <!-- LOGIN FORM -->
            <form id="loginForm">

                <label for="loginEmail">Email Address</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" class="login-button">
                    Log In
                </button>

            </form>

            <!-- REGISTRATION FORM -->
            <form id="registerForm" hidden>

                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >

                <label for="registerEmail">Email Address</label>
                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <label for="registerPassword">Password</label>
                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <button type="submit" class="login-button">
                    Create Account
                </button>

            </form>

            <!-- AUTHENTICATION MESSAGES -->
            <p id="authMessage" role="status" aria-live="polite"></p>

            <!-- FORM SWITCHER -->
            <p class="register-text" id="loginSwitcher">
                New to Aralytics?
                <a href="#" id="showRegister">Create an account</a>
            </p>

            <p class="register-text" id="registerSwitcher" hidden>
                Already have an account?
                <a href="#" id="showLogin">Log in</a>
            </p>

        </div>

    </main>

    <!-- SUPABASE LIBRARY -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- SUPABASE CONNECTION -->
    <script src="js/supabase.js"></script>

    <!-- ACCOUNT FUNCTIONALITY -->
    <script src="js/auth.js"></script>

</body>
</html>
