
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Profile | Aralytics</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h2><a href="index.html">Aralytics</a></h2>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main class="login-container">

        <div class="login-card">

            <h1>Create Your Profile</h1>

            <p class="login-description">
                Tell us a little about yourself so we can personalize your academic dashboard.
            </p>

            <form id="profileForm">

                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >

                <label for="gradeLevel">Grade Level</label>
                <select id="gradeLevel" required>
                    <option value="">Select Grade Level</option>
                    <option value="7">Grade 7</option>
                    <option value="8">Grade 8</option>
                    <option value="9">Grade 9</option>
                    <option value="10">Grade 10</option>
                    <option value="11">Grade 11</option>
                    <option value="12">Grade 12</option>
                </select>

                <label for="semester">Current Semester</label>
                <select id="semester" required>
                    <option value="">Select Semester</option>
                    <option value="1">Semester 1</option>
                    <option value="2">Semester 2</option>
                </select>

                <label for="period">Current Grading Period</label>
                <select id="period" required>
                    <option value="">Select Grading Period</option>
                    <option value="Midterms">Midterms</option>
                    <option value="Finals">Finals</option>
                </select>

                <button type="submit" class="login-button" id="saveProfileButton">
                    Save Profile
                </button>

            </form>

            <p id="profileMessage" role="status" aria-live="polite"></p>

            <p class="register-text">
                Already have an account?
                <a href="login.html">Log In</a>
            </p>

        </div>

    </main>

    <!-- SUPABASE LIBRARY -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- SUPABASE CONNECTION -->
    <script src="js/supabase.js"></script>

    <script>

        document.addEventListener("DOMContentLoaded", async function() {

            const supabase = window.supabaseClient;

            const profileForm = document.getElementById("profileForm");
            const saveButton = document.getElementById("saveProfileButton");
            const profileMessage = document.getElementById("profileMessage");

            let currentUser = null;

            // CHECK LOGIN SESSION
            async function initializeProfile() {

                try {

                    const { data, error } = await supabase.auth.getSession();

                    if (error) {
                        throw error;
                    }

                    currentUser = data.session?.user;

                    // Require a logged-in account
                    if (!currentUser) {
                        window.location.href = "login.html";
                        return;
                    }

                    // LOAD EXISTING PROFILE
                    const { data: profile, error: profileError } = await supabase
                        .from("profiles")
                        .select("full_name, grade_level, semester, grading_period")
                        .eq("id", currentUser.id)
                        .maybeSingle();

                    if (profileError) {
                        throw profileError;
                    }

                    // Fill in previously saved information
                    if (profile) {

                        document.getElementById("fullName").value =
                            profile.full_name || "";

                        document.getElementById("gradeLevel").value =
                            profile.grade_level ?? "";

                        document.getElementById("semester").value =
                            profile.semester ?? "";

                        document.getElementById("period").value =
                            profile.grading_period || "";

                    }

                } catch (error) {

                    profileMessage.textContent =
                        "Unable to load your profile: " + error.message;

                }

            }

            await initializeProfile();

            // SAVE PROFILE
            profileForm.addEventListener("submit", async function(event) {

                event.preventDefault();

                if (!currentUser) {
                    profileMessage.textContent =
                        "Please log in before saving your profile.";
                    return;
                }

                const profile = {
                    fullName: document.getElementById("fullName").value.trim(),
                    grade: document.getElementById("gradeLevel").value,
                    semester: document.getElementById("semester").value,
                    period: document.getElementById("period").value
                };

                if (!profile.fullName || !profile.grade ||
                    !profile.semester || !profile.period) {

                    profileMessage.textContent =
                        "Please complete all fields.";
                    return;
                }

                saveButton.disabled = true;
                saveButton.textContent = "Saving...";
                profileMessage.textContent = "";

                try {

                    // SAVE TO SUPABASE
                    const { error } = await supabase
                        .from("profiles")
                        .update({
                            full_name: profile.fullName,
                            grade_level: Number(profile.grade),
                            semester: Number(profile.semester),
                            grading_period: profile.period,
                            updated_at: new Date().toISOString()
                        })
                        .eq("id", currentUser.id);

                    if (error) {
                        throw error;
                    }

                    // UPDATE LOCAL STORAGE FOR EXISTING ARALYTICS FEATURES
                    localStorage.setItem(
                        "aralyticsUserProfile",
                        JSON.stringify(profile)
                    );

                    localStorage.setItem(
                        "aralyticsCurrentGrade",
                        profile.grade
                    );

                    localStorage.setItem(
                        "aralyticsCurrentSemester",
                        profile.semester
                    );

                    localStorage.setItem(
                        "aralyticsCurrentPeriod",
                        profile.period
                    );

                    alert("Your profile has been saved successfully!");

                    window.location.href = "dashboard.html";

                } catch (error) {

                    profileMessage.textContent =
                        "Unable to save your profile: " + error.message;

                } finally {

                    saveButton.disabled = false;
                    saveButton.textContent = "Save Profile";

                }

            });

        });

    </script>

</body>
</html>
